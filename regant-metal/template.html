<title>Regant Metal</title>

<style>
/* Layout: mobile-first Telegram mini-app shop — white header, light hero, category pills, 2-col catalog, bottom tabs. Single light look by design. */
:root {
  --bg: #F4F6FA;
  --white: #FFFFFF;
  --ink: #111318;
  --blue: #1A6BFF;
  --gray: #6B7280;
  --gray-2: #9CA3AF;
  --line: #E4E7EE;
  --pic-a: #EEF0F4;
  --pic-b: #E2E6ED;
  --err: #D92D20;
  --ok: #12805C;
  --font: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --tabbar: 62px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 20px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--white); }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--white); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 13px; }
.brand { text-decoration: none; display: grid; gap: 5px; min-width: 0; }
.brand b { font-size: 20px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.brand small { font-size: 10px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--gray); white-space: nowrap; }
.lang { display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); flex: none; }
.lang button { min-height: 30px; padding: 0 11px; border: 0; border-radius: 999px; background: transparent; color: var(--gray); font-weight: 600; font-size: 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--white); }

/* Hero */
.hero { padding-block: 26px 4px; display: grid; gap: 12px; }
.eyebrow { color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; }
.hero h1 { font-size: 36px; font-weight: 800; letter-spacing: -.04em; line-height: 1.02; }
.hero p { color: var(--gray); font-size: 15px; line-height: 1.55; max-width: 30em; }
.banner { margin-top: 10px; background: var(--ink); color: var(--white); border-radius: 18px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.banner b { display: block; font-size: 16px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.banner span { color: #7FA8FF; font-size: 13px; }
.banner .dot { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--white); display: grid; place-items: center; }
.banner .dot img { width: 28px; height: auto; display: block; }
.rm { display: inline-block; height: .74em; width: .77em; margin-right: .03em; background: currentColor; -webkit-mask: url("rasmlar/r.png") no-repeat left bottom / contain; mask: url("rasmlar/r.png") no-repeat left bottom / contain; }
img.rl { height: .74em; width: auto; vertical-align: baseline; margin-right: .03em; }

/* Filters */
.chips { display: flex; gap: 8px; margin-top: 20px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--white); }

.search { position: relative; margin-top: 12px; }
.search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--gray-2); pointer-events: none; }
.search input { width: 100%; min-height: 44px; padding: 0 14px 0 40px; font: inherit; font-size: 16px; color: var(--ink); background: var(--white); border: 1px solid var(--line); border-radius: 999px; }
.search input::placeholder { color: var(--gray-2); }
.search input:focus { outline: none; border-color: var(--blue); }
.nothing { grid-column: 1 / -1; text-align: center; color: var(--gray); font-size: 14px; padding: 28px 10px; background: var(--white); border: 1px dashed var(--line); border-radius: 18px; }
.sec-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 22px 0 12px; }
.sec-row small { color: var(--gray); font-size: 13px; white-space: nowrap; }
.cur { display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); flex: none; }
.cur button { min-height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--gray); font-size: 12px; font-weight: 600; cursor: pointer; }
.cur button[aria-pressed="true"] { background: var(--blue); color: var(--white); }

/* Product cards */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; box-shadow: 0 1px 2px rgba(17,19,24,.03); }
.pic { position: relative; aspect-ratio: 1 / .82; max-width: 100%; background: linear-gradient(160deg, var(--pic-a), var(--pic-b)); display: grid; place-items: center; overflow: hidden; }
.pic > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.pic .ph { font-size: 12px; font-weight: 600; letter-spacing: .24em; color: var(--gray); text-transform: uppercase; }
.pic .wm { position: absolute; right: 10px; bottom: 8px; font-size: 8.5px; font-weight: 700; letter-spacing: .26em; color: var(--gray); }
.body { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.body h3 { font-size: 14.5px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
.body .cat { color: var(--gray); font-size: 12.5px; }
.buy { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; padding-top: 12px; }
.price { font-size: 14px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; min-width: 0; }
.price span { display: block; font-weight: 700; }
.price small { display: block; font-size: 11px; font-weight: 500; color: var(--gray); }
.price.ask { font-size: 12.5px; color: var(--gray); font-weight: 600; }
.add { flex: none; min-height: 40px; padding: 4px 14px; border: 0; border-radius: 999px; background: var(--blue); color: var(--white); font-size: 12.5px; font-weight: 600; line-height: 1.15; cursor: pointer; display: grid; justify-items: center; }
.add b { font-size: 14px; line-height: 1; }
.buy.in { flex-direction: column; align-items: stretch; gap: 8px; }
.buy.in .price span { display: inline; margin-left: 3px; }
.buy.in .stepper { width: 100%; grid-template-columns: 36px 1fr 36px; }
.buy.in .stepper button { width: 36px; }
.stepper { flex: none; display: inline-grid; grid-template-columns: 32px auto 32px; align-items: center; height: 36px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.stepper button { height: 34px; width: 32px; border: 0; background: transparent; font-size: 17px; font-weight: 600; cursor: pointer; line-height: 1; border-radius: 999px; }
.stepper button.plus { background: var(--blue); color: var(--white); }
.stepper output { text-align: center; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 5px; min-width: 22px; }
.hint { color: var(--gray); font-size: 12.5px; margin-top: 14px; }

/* Pages */
.view { padding-block: 20px 8px; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.page-head h2 { font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
.back { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--white); text-decoration: none; flex: none; }
.back svg { width: 18px; height: 18px; }

/* Cart */
.list { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 76px 1fr; gap: 12px; background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 10px; }
.line .pic { aspect-ratio: 1; border-radius: 12px; width: 76px; }
.line .pic .ph { font-size: 8px; letter-spacing: .14em; }
.line .pic .wm { display: none; }
.line-body { display: grid; gap: 2px; min-width: 0; align-content: center; }
.line-body h3 { font-size: 14.5px; font-weight: 700; }
.line-body .cat { color: var(--gray); font-size: 12.5px; }
.line-bot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.line-sum { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.line-sum.ask { color: var(--gray); font-size: 12.5px; font-weight: 600; }
.summary { margin-top: 14px; background: var(--ink); color: var(--white); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.total span { color: #A7ADB8; font-size: 14px; }
.total b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.summary small { color: #A7ADB8; font-size: 12.5px; }
.big { width: 100%; min-height: 50px; border: 0; border-radius: 999px; background: var(--blue); color: var(--white); font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
.big[disabled] { opacity: .6; cursor: progress; }
.empty { text-align: center; background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 34px 20px; display: grid; gap: 8px; justify-items: center; }
.empty svg { width: 44px; height: 44px; color: var(--gray-2); }
.empty b { font-size: 16px; }
.empty p { color: var(--gray); font-size: 14px; max-width: 24em; }
.empty .big { max-width: 260px; margin-top: 8px; }

/* Checkout */
.form { display: grid; gap: 12px; }
.mini { color: var(--gray); font-size: 14px; }
.field { background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.field > label, .field legend { font-weight: 700; font-size: 15px; padding: 0; }
fieldset.field { margin: 0; min-width: 0; }
textarea, input[type="tel"] { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
textarea { min-height: 76px; resize: vertical; }
textarea:focus, input[type="tel"]:focus { border-color: var(--blue); outline: none; }
.geo { min-height: 46px; border: 0; background: var(--ink); color: var(--white); border-radius: 999px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.geo svg { width: 18px; height: 18px; color: #7FA8FF; }
.geo-status { font-size: 13.5px; }
.geo-status.ok { color: var(--ok); font-weight: 600; }
.geo-status.bad { color: var(--err); }
.geo-status a { margin-left: 6px; color: var(--blue); }
.phone { display: flex; }
.phone span { display: grid; place-items: center; padding: 0 12px; font-size: 16px; font-weight: 600; background: var(--bg); border: 1px solid var(--line); border-right: 0; border-radius: 14px 0 0 14px; }
.phone input { border-radius: 0 14px 14px 0; font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--bg); font-size: 14.5px; }
.opt input { width: 18px; height: 18px; accent-color: var(--blue); flex: none; margin: 0; }
.opt:has(input:checked) { border-color: var(--blue); background: var(--white); }
.small-note { color: var(--gray); font-size: 12.5px; }
.err { color: var(--err); font-size: 13px; font-weight: 600; }
.notice { border-radius: 14px; padding: 12px 14px; background: var(--white); border: 1px solid var(--line); font-size: 14px; }

.done { padding-block: 26px 8px; display: grid; gap: 14px; }
.done-head { text-align: center; display: grid; gap: 8px; justify-items: center; }
.done .tick { width: 60px; height: 60px; border-radius: 50%; background: #22B24C; display: grid; place-items: center; color: var(--white); }
.done .tick svg { width: 30px; height: 30px; }
.done h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.done-head p { color: var(--gray); font-size: 14.5px; max-width: 24em; }
.receipt { background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: grid; gap: 12px; }
.receipt h3 { font-size: 16px; font-weight: 700; }
.rc-row { display: grid; gap: 1px; }
.rc-row small { color: var(--gray); font-size: 12.5px; }
.rc-row b { font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
.rc-items { display: flex; gap: 8px; flex-wrap: wrap; }
.rc-items img { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; display: block; }
.rc-list { display: grid; gap: 4px; font-size: 13.5px; }
.rc-list div { display: flex; justify-content: space-between; gap: 10px; }
.rc-list span:last-child { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rc-total { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 10px; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.promo { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #F7F7F7; display: grid; grid-template-columns: 42% 1fr; align-items: center; }
.promo > img { width: 100%; height: auto; display: block; }
.promo div { padding: 14px 16px 14px 4px; display: grid; gap: 4px; }
.promo b { font-size: 16px; font-weight: 800; letter-spacing: .04em; }
.promo span { color: var(--gray); font-size: 13px; }
.done .big { margin-top: 4px; }

/* Contact */
.about { background: var(--ink); color: var(--white); border-radius: 18px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; margin-bottom: 12px; font-size: 14px; }
.about b { font-size: 30px; font-weight: 800; color: #7FA8FF; line-height: 1; flex: none; letter-spacing: -.03em; }
.box { background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; display: grid; margin-bottom: 12px; }
.box h3 { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--gray); font-weight: 600; padding-top: 12px; }
.row { display: flex; align-items: center; gap: 12px; text-decoration: none; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row svg { width: 20px; height: 20px; flex: none; color: var(--blue); }
.row span { display: grid; line-height: 1.3; min-width: 0; }
.row small { color: var(--gray); font-size: 12px; }
.row b { font-size: 15px; font-weight: 600; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--white); border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar); }
.tab { display: grid; justify-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--gray-2); font-size: 11px; font-weight: 600; }
.tab[aria-current="page"] { color: var(--blue); }
.tab .ic { position: relative; width: 22px; height: 22px; }
.tab .ic svg { width: 22px; height: 22px; }
.badge { position: absolute; top: -6px; right: -12px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--blue); color: var(--white); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

.flyer { position: fixed; z-index: 50; pointer-events: none; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 28px rgba(17,19,24,.2); }
.flyer .pic { width: 100%; height: 100%; }
.plus1 { position: fixed; z-index: 51; pointer-events: none; font-weight: 800; font-size: 14px; color: var(--blue); }

@media (prefers-reduced-motion: no-preference) {
  .add, .big, .chip, .stepper button { transition: transform .12s ease; }
  .add:active, .big:active, .chip:active, .stepper button:active { transform: scale(.95); }
}
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><b><img class="rl" src="rasmlar/r.png" alt="R">egant Metal</b><small data-t="tagline"></small></a>
    <div class="lang" role="group" aria-label="Til / Язык">
      <button type="button" id="lang-uz" data-lang="uz" aria-pressed="true">UZ</button>
      <button type="button" id="lang-ru" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </div>
</header>

<main>
  <section data-view="">
    <div class="wrap">
      <div class="hero">
        <span class="eyebrow" data-t="eyebrow"></span>
        <h1 id="h1"></h1>
        <p data-t="lead"></p>
        <div class="banner">
          <div><b><img class="rl" src="rasmlar/r-oq.png" alt="R">egant Metal</b><span data-t="bannerSub"></span></div>
          <div class="dot"><img src="rasmlar/r.png" alt=""></div>
        </div>
      </div>

      <div class="chips" id="chips" role="group" aria-label="Kategoriya"></div>
      <div class="search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15zM16 16l5 5"/></svg>
        <input type="search" id="q" inputmode="search" autocomplete="off" enterkeyhint="search">
      </div>

      <div class="sec-row">
        <small id="cur-note"></small>
        <div class="cur" role="group" aria-label="Valyuta">
          <button type="button" id="cur-uzs" data-cur="uzs" aria-pressed="true">So'm</button>
          <button type="button" id="cur-usd" data-cur="usd" aria-pressed="false">$</button>
        </div>
      </div>

const PRODUCTS = [];
for (const c of CATS) {
  (DATA[c.id] || []).forEach((r, i) => {
    const [size, spec, price, len] = r;
    const dims = String(size).replace("*", "×");
    PRODUCTS.push({
      id: c.id + "-" + i, cat: c.id, dims, spec, price: price == null ? null : Number(price), len,
      name: l => `${c[l]} ${dims}`,
      sub: l => {
        const s = typeof spec === "number" ? `${T[l].wall} ${String(spec).replace(".", ",")} mm` : String(spec).replace("А", "A");
        return `${s} · ${String(len).replace(".", ",")} ${T[l].m}`;
      },
    });
  });
}
const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));

const ORDER_URL = document.querySelector('meta[name="order-endpoint"]')?.content || "";
let lang = "uz", cur = "uzs", cat = "armatura", query = "";
const EXAMPLES = { armatura: "Ø12", truba: "32x2", profil: "30x20x1,7", ugolok: "50x50x4" };
const nums = s => (String(s).toLowerCase().replace(/,/g, ".").match(/\d+(\.\d+)?/g) || []);
function matches(p, q) {
  const qn = nums(q); if (!qn.length) return true;
  const pn = nums(p.dims);
  for (let i = 0; i + qn.length <= pn.length; i++) {
    let ok = true;
    for (let j = 0; j < qn.length; j++) {
      const last = j === qn.length - 1;
      if (last ? !(pn[i + j] === qn[j] || (pn[i + j].startsWith(qn[j]) && !/[x×х*\s]$/i.test(q.trim()))) : pn[i + j] !== qn[j]) { ok = false; break; }
    }
    if (ok) return true;
  }
  return false;
}
const t = k => T[lang][k];
const $ = s => document.querySelector(s);
const fmtInt = n => Math.round(n).toLocaleString("ru-RU").replace(/[  ]/g, " ");
const money = n => cur === "usd" ? "$" + (n / USD_RATE).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : fmtInt(n) + " " + t("sum");
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const catName = id => CATS.find(c => c.id === id)[lang];

/* Cart: { productId: metres } */
let cart = {};

for (const id in cart) if (!byId[id] || !(cart[id] > 0)) delete cart[id];
const saveCart = () => { try { localStorage.setItem("regant-cart2", JSON.stringify(cart)); } catch (e) {} };
const count = () => Object.keys(cart).length;
const qtyTotal = () => Object.values(cart).reduce((a, b) => a + b, 0);
const sum = () => Object.entries(cart).reduce((a, [id, q]) => a + (byId[id].price || 0) * q, 0);
const hasAsk = () => Object.keys(cart).some(id => byId[id].price == null);

const picHTML = p => `<img src="rasmlar/${p.cat}.jpg" alt="${catName(p.cat)}" loading="lazy"><span class="wm"><span class="rm" aria-hidden="true"></span>EGANT</span>`;
const stepperHTML = p => `<div class="stepper"><button type="button" data-act="dec" data-id="${p.id}" aria-label="−1">−</button><output>${cart[p.id]} ${t("m")}</output><button type="button" class="plus" data-act="inc" data-id="${p.id}" aria-label="+1">+</button></div>`;

function priceHTML(p) {
  if (p.price == null) return `<div class="price ask">${t("ask")}</div>`;
  const q = cart[p.id] || 0;
  const n = q ? p.price * q : p.price;
  const unit = q ? `${q} ${t("m")}` : `1 ${t("meter")}`;
  if (cur === "usd") return `<div class="price">${money(n)}<small>${unit}</small></div>`;
  return `<div class="price">${fmtInt(n)}<span>${t("sum")}</span><small>${unit}</small></div>`;
}

function renderGrid() {

/* Card flies down into the cart tab, then "+1" */
function flyToCart(card, onLand) {
  const target = $("#cart-ic").getBoundingClientRect();
  const land = () => { onLand(); plusOne(target); };
  if (!card || reduced()) { land(); return; }
  const pic = card.querySelector(".pic");
  const r = pic.getBoundingClientRect();
  const fl = document.createElement("div");
  fl.className = "flyer";
  fl.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  fl.appendChild(pic.cloneNode(true));
  document.body.appendChild(fl);
  const dx = target.left + target.width / 2 - (r.left + r.width / 2);
  const dy = target.top + target.height / 2 - (r.top + r.height / 2);
  fl.animate([
    { transform: "translate(0,0) scale(1)", opacity: 1 },
    { transform: `translate(${dx * 0.3}px, ${Math.min(dy * 0.15, 0) - 40}px) scale(.7)`, opacity: 1, offset: 0.35 },
    { transform: `translate(${dx}px, ${dy}px) scale(.1)`, opacity: .7 },
  ], { duration: 700, easing: "cubic-bezier(.45,0,.7,1)" }).onfinish = () => { fl.remove(); land(); };
}
function plusOne(target) {
  const el = document.createElement("div");
  el.className = "plus1"; el.textContent = "+1";
  el.style.left = (target.left + target.width) + "px";
  el.style.top = (target.top - 6) + "px";
  document.body.appendChild(el);
  if (reduced()) { setTimeout(() => el.remove(), 700); return; }
  el.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-28px)", opacity: 0 }], { duration: 750, easing: "ease-out" }).onfinish = () => el.remove();
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { cat = chip.dataset.cat; query = ""; $("#q").value = ""; setSearchPh(); renderChips(); renderGrid(); return; }
  const cb = e.target.closest(".cur button");
  if (cb) { cur = cb.dataset.cur; try { localStorage.setItem("regant-cur", cur); } catch (err) {} renderAll(); return; }
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  const card = btn.closest(".card");
  const isNew = !cart[id];
  if (act === "dec") {
    cart[id] = (cart[id] || 0) - 1;
    if (cart[id] <= 0) delete cart[id];
  } else {
    cart[id] = (cart[id] || 0) + 1;
  }
  saveCart();
  if (act === "add" && card) flyToCart(card, () => renderCounts(true));
  else if (act === "inc") { plusOne($("#cart-ic").getBoundingClientRect()); renderCounts(isNew); }
  else renderCounts(false);
  renderGrid(); renderCart();
  $("#co-sum").textContent = `${t("pcs")(count())} · ${money(sum())}`;
});

/* Pages */
const VIEWS = ["", "savatcha", "rasmiylashtirish", "tayyor", "aloqa"];
let orderDone = false;
function route() {
  let v = location.hash.replace("#", "");
  if (!VIEWS.includes(v)) v = "";
  if (v === "rasmiylashtirish" && count() === 0) v = "savatcha";
  if (v === "tayyor" && !orderDone) v = "";
  document.querySelectorAll("[data-view]").forEach(s => s.hidden = s.dataset.view !== v);
  const tab = v === "rasmiylashtirish" ? "savatcha" : v === "tayyor" ? "" : v;
  document.querySelectorAll(".tab").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

/* Language */
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[l][el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-tp]").forEach(el => el.placeholder = T[l][el.dataset.tp]);
  document.querySelectorAll("[data-ta]").forEach(el => el.setAttribute("aria-label", T[l][el.dataset.ta]));
  document.querySelectorAll("[data-brand]").forEach(el => el.innerHTML = brandify(T[l][el.dataset.t], true));
  const h = $("#h1"); h.textContent = ""; h.append(T[l].h1[0], document.createElement("br"), T[l].h1[1]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  try { localStorage.setItem("regant-lang", l); } catch (e) {}
  renderAll();
  if (geo) showGeoOk();
  if (lastOrder) renderReceipt();
}
function setSearchPh() { const el = $("#q"); if (el) el.placeholder = t("searchPh")(catName(cat)) + EXAMPLES[cat]; }
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* Checkout */
let geo = null;
const geoStatus = $("#geo-status");
function showGeoOk() {
  geoStatus.hidden = false; geoStatus.className = "geo-status ok"; geoStatus.innerHTML = "";
  geoStatus.append(t("geoOk"));
  const a = document.createElement("a");
  a.href = `https://yandex.uz/maps/?pt=${geo.lon},${geo.lat}&z=17&l=map`;
  a.target = "_blank"; a.rel = "noopener"; a.textContent = t("geoMap");
  geoStatus.append(a);
}
$("#geo-btn").addEventListener("click", () => {
  geoStatus.hidden = false; geoStatus.className = "geo-status"; geoStatus.textContent = t("geoWait");
  if (!navigator.geolocation) { geoStatus.className = "geo-status bad"; geoStatus.textContent = t("geoErr"); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { geo = { lat: +pos.coords.latitude.toFixed(6), lon: +pos.coords.longitude.toFixed(6) }; showGeoOk(); $("#err-addr").hidden = true; },
    err => { geoStatus.className = "geo-status bad"; geoStatus.textContent = err.code === 1 ? t("geoDenied") : t("geoErr"); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
});

const phoneEl = $("#phone");
phoneEl.addEventListener("input", () => {
  const d = phoneEl.value.replace(/\D/g, "").replace(/^998/, "").slice(0, 9);
  phoneEl.value = [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean).join(" ");
});
function showErr(id, on, key) { const e = $(id); e.hidden = !on; if (on) e.textContent = t(key); }

$("#order-form").addEventListener("submit", async e => {
  e.preventDefault();
  const address = $("#addr").value.trim();
  const digits = phoneEl.value.replace(/\D/g, "");
  const pay = document.querySelector('input[name="pay"]:checked')?.value;
  const badAddr = !address && !geo, badPhone = digits.length !== 9, badPay = !pay;
  showErr("#err-addr", badAddr, "errAddr");
  showErr("#err-phone", badPhone, "errPhone");
  showErr("#err-pay", badPay, "errPay");
  const msg = $("#send-msg"); msg.hidden = true;
  if (badAddr || badPhone || badPay) { document.querySelector(".err:not([hidden])")?.closest(".field")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const btn = $("#submit-btn"), label = btn.querySelector("span");
  btn.disabled = true; label.textContent = t("sending");
  const order = {
    items: Object.entries(cart).map(([id, q]) => ({ name: byId[id].name("uz") + " (" + byId[id].sub("uz") + ")", qty: q, unit: "m", price: byId[id].price })),
    total: sum(), address, location: geo, phone: "+998" + digits, payment: pay, lang, currency: cur, usdRate: USD_RATE,
  };
  try {
    if (ORDER_URL) {
      const res = await fetch(ORDER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(order) });
      if (!res.ok) throw new Error(res.status);
    }
    lastOrder = { cart: { ...cart }, address, geo, phone: "+998 " + phoneEl.value, pay, preview: !ORDER_URL };
    cart = {}; saveCart(); geo = null; geoStatus.hidden = true;
    e.target.reset(); orderDone = true; renderAll(); renderReceipt();
    location.hash = "tayyor";
  } catch (err) {
    msg.textContent = t("errSend"); msg.hidden = false;
  } finally {
    btn.disabled = false; label.textContent = t("submit");
  }
});

/* Success page */
let lastOrder = null;
function renderReceipt() {
  const o = lastOrder; if (!o) return;
  const ids = Object.keys(o.cart);
  const total = ids.reduce((a, id) => a + (byId[id].price || 0) * o.cart[id], 0);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const cats = [...new Set(ids.map(id => byId[id].cat))];
  $("#receipt").innerHTML = `
    <h3>${t("rcTitle")}</h3>
    <div class="rc-row"><small>${t("rcAddr")}</small><b>${o.address ? esc(o.address) : ""}${o.address && o.geo ? " · " : ""}${o.geo ? t("rcGeo") : ""}</b></div>
    <div class="rc-row"><small>${t("rcPhone")}</small><b>${esc(o.phone)}</b></div>
    <div class="rc-row"><small>${t("rcPay")}</small><b>${t("pay_" + o.pay)}</b></div>
    <div class="rc-row"><small>${t("rcItems")}</small></div>
    <div class="rc-items">${cats.map(c => `<img src="rasmlar/${c}.jpg" alt="${catName(c)}">`).join("")}</div>
    <div class="rc-list">${ids.map(id => `<div><span>${byId[id].name(lang)} · ${o.cart[id]} ${t("m")}</span><span>${byId[id].price == null ? t("ask") : money(byId[id].price * o.cart[id])}</span></div>`).join("")}</div>
    <div class="rc-total"><span>${t("total")}</span><span>${money(total)}</span></div>`;
  const n = $("#done-note"); n.hidden = !o.preview; n.textContent = t("previewDone");
}

$("#q").addEventListener("input", e => { query = e.target.value; renderGrid(); });

/* Live USD rate from the Central Bank of Uzbekistan */
fetch("https://cbu.uz/uz/arkhiv-kursov-valyut/json/USD/")
  .then(r => r.json())
  .then(d => { const r = parseFloat(d?.[0]?.Rate); if (r > 0) { USD_RATE = r; RATE_DATE = d[0].Date || RATE_DATE; renderAll(); } })
  .catch(() => {});

/* Start */
let savedLang = null;
try { savedLang = localStorage.getItem("regant-lang"); cur = localStorage.getItem("regant-cur") === "usd" ? "usd" : "uzs"; } catch (e) {}
setLang(savedLang === "ru" ? "ru" : "uz");
route();
</script>
