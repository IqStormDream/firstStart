<style>
/* Layout: shop app — product grid first, bottom tab bar (Mahsulotlar / Savatcha / Aloqa), large type for older buyers */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --pic: #e6ebf0;
  --ink: #16212b;
  --muted: #56636f;
  --line: #d6dde4;
  --steel: #1e3447;
  --steel-ink: #f2f5f8;
  --accent: #b8460f;
  --accent-ink: #ffffff;
  --ok: #1d7a46;
  --err: #b3261e;
  --font-display: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  --tabbar: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171e; --surface: #18222c; --pic: #223140; --ink: #eef2f6; --muted: #a9b5c1; --line: #2b3946;
    --steel: #0b1218; --steel-ink: #eef2f6; --accent: #e5732f; --accent-ink: #1a0b02; --ok: #4cc47f; --err: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171e; --surface: #18222c; --pic: #223140; --ink: #eef2f6; --muted: #a9b5c1; --line: #2b3946;
  --steel: #0b1218; --steel-ink: #eef2f6; --accent: #e5732f; --accent-ink: #1a0b02; --ok: #4cc47f; --err: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 16px);
}
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; text-transform: uppercase; letter-spacing: .02em; line-height: 1.15; text-wrap: balance; }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { background: var(--steel); color: var(--steel-ink); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.logo svg { width: 36px; height: 36px; flex: none; }
.logo span { display: grid; line-height: 1.1; min-width: 0; }
.logo b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.logo small { font-size: .82rem; opacity: .75; }
.lang { display: flex; border: 2px solid rgba(255,255,255,.35); border-radius: 8px; overflow: hidden; flex: none; }
.lang button { font-weight: 600; font-size: .95rem; padding: 0 12px; min-height: 40px; background: transparent; color: var(--steel-ink); border: 0; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--steel-ink); color: var(--steel); }

.view { padding-block: 20px 8px; }
.view-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.back { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; flex: none; }
.back svg { width: 22px; height: 22px; }
.hint { color: var(--muted); font-size: .95rem; margin-top: 14px; }

/* Product cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.pic { aspect-ratio: 1 / 1; max-width: 100%; background: var(--pic); display: grid; place-items: center; color: var(--steel); }
:root[data-theme="dark"] .pic { color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pic { color: var(--muted); } }
.pic svg { width: 48%; height: 48%; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.info { padding: 10px 12px 0; display: grid; gap: 2px; }
.pr { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.pr span { font-size: .9rem; font-weight: 600; color: var(--muted); margin-left: 3px; }
.card h3 { font-size: 1.05rem; font-weight: 500; }
.act { padding: 12px; margin-top: auto; }
.add { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.add svg { width: 20px; height: 20px; }
.stepper { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; min-height: 48px; background: var(--pic); border-radius: 10px; overflow: hidden; }
.stepper button { height: 48px; border: 0; background: transparent; color: var(--ink); font-size: 1.6rem; font-weight: 600; cursor: pointer; line-height: 1; }
.stepper button.plus { background: var(--accent); color: var(--accent-ink); }
.stepper output { text-align: center; font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }

/* Cart */
.list { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 72px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.line .pic { border-radius: 10px; width: 72px; }
.line-body { display: grid; gap: 8px; min-width: 0; }
.line-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.line-top h3 { font-size: 1.1rem; font-weight: 600; }
.line-top small { color: var(--muted); font-size: .9rem; }
.line-bot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.line .stepper { width: 150px; }
.line-sum { font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.summary { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.total span { color: var(--muted); }
.total b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.big { width: 100%; min-height: 58px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 1.15rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
.big[disabled] { opacity: .6; cursor: progress; }
.big.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.empty { text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 36px 20px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 64px; height: 64px; color: var(--muted); }
.empty b { font-size: 1.25rem; }
.empty p { color: var(--muted); max-width: 26em; }
.empty .big { max-width: 320px; margin-top: 6px; }

/* Checkout */
.form { display: grid; gap: 14px; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.field > label, .field legend { font-weight: 700; font-size: 1.1rem; padding: 0; }
fieldset.field { margin: 0; min-width: 0; }
textarea, input[type="tel"] { width: 100%; font: inherit; font-size: 1.1rem; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; }
textarea { min-height: 84px; resize: vertical; }
textarea:focus, input[type="tel"]:focus { border-color: var(--accent); outline: none; }
.geo { min-height: 52px; border: 2px solid var(--accent); color: var(--accent); background: transparent; border-radius: 10px; font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.geo svg { width: 22px; height: 22px; }
.geo-status { font-size: .98rem; }
.geo-status.ok { color: var(--ok); font-weight: 600; }
.geo-status.bad { color: var(--err); }
.geo-status a { margin-left: 6px; }
.phone { display: flex; align-items: stretch; }
.phone span { display: grid; place-items: center; padding: 0 12px; font-size: 1.1rem; font-weight: 600; background: var(--pic); border: 2px solid var(--line); border-right: 0; border-radius: 10px 0 0 10px; }
.phone input { border-radius: 0 10px 10px 0; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--bg); }
.opt input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0; }
.opt:has(input:checked) { border-color: var(--accent); }
.small-note { color: var(--muted); font-size: .92rem; }
.err { color: var(--err); font-size: .98rem; font-weight: 600; }
.mini { color: var(--muted); }
.notice { border-radius: 12px; padding: 14px 16px; background: var(--pic); font-size: 1rem; }

.done { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 30px 8px; }
.done .tick { width: 84px; height: 84px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; color: #fff; }
.done .tick svg { width: 46px; height: 46px; }
.done h2 { font-size: 1.7rem; }
.done p { color: var(--muted); max-width: 26em; }
.done .big { max-width: 320px; }

/* Contact */
.about { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.about b { font-family: var(--font-display); font-size: 2.6rem; color: var(--accent); line-height: 1; flex: none; }
.about p { color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px; display: grid; margin-bottom: 14px; }
.box h3 { font-size: 1.05rem; color: var(--muted); font-weight: 600; padding-top: 10px; }
.row { display: flex; align-items: center; gap: 14px; text-decoration: none; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row svg { width: 26px; height: 26px; flex: none; color: var(--accent); }
.row span { display: grid; line-height: 1.3; min-width: 0; }
.row small { color: var(--muted); font-size: .88rem; }
.row b { font-size: 1.12rem; font-weight: 600; }

/* Bottom tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar); }
.tab { display: grid; justify-items: center; align-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: .85rem; font-weight: 600; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .ic { position: relative; width: 28px; height: 28px; }
.tab .ic svg { width: 28px; height: 28px; }
.badge { position: absolute; top: -6px; right: -12px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-size: .8rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

/* Flying card + "+1" */
.flyer { position: fixed; z-index: 50; pointer-events: none; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.flyer .pic { width: 100%; height: 100%; }
.plus1 { position: fixed; z-index: 51; pointer-events: none; font-weight: 800; font-size: 1.2rem; color: var(--accent); }

@media (prefers-reduced-motion: no-preference) {
  .add, .big, .stepper button { transition: filter .12s ease, transform .12s ease; }
  .add:active, .big:active, .stepper button:active { transform: scale(.97); }
}
</style>

  },

    tabProducts: "Товары", tabCart: "Корзина", tabContact: "Контакты",

    geoOk: "Местоположение получено.", geoMap: "Посмотреть на карте",
    geoErr: "Не удалось определить местоположение. Напишите адрес ниже.",

    contactTitle: "Контакты",
    aboutText: "Regant Metal уже 25 лет торгует металлопрокатом.",
    phoneRow: "Телефон", orderRow: "Для заказа",
    storesTitle: "Наши магазины", a1: "Магазин 1: рынок Изза", a2: "Магазин 2: Ибн Сино", map: "Открыть на карте",
  },
};

/* Buyurtma qabul qiluvchi manzil (Netlify'da yoqiladi). Bo'sh bo'lsa sinov rejimi. */
const ORDER_URL = document.querySelector('meta[name="order-endpoint"]')?.content || "";

let lang = "uz";
const t = k => T[lang][k];
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/[  ]/g, " ");
const $ = s => document.querySelector(s);

/* ----- Cart state ----- */
let cart = {};
try { cart = JSON.parse(localStorage.getItem("regant-cart") || "{}") || {}; } catch (e) { cart = {}; }
for (const id in cart) if (!PRODUCTS.find(p => p.id === id) || !(cart[id] > 0)) delete cart[id];
const saveCart = () => { try { localStorage.setItem("regant-cart", JSON.stringify(cart)); } catch (e) {} };
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const sum = () => PRODUCTS.reduce((a, p) => a + (cart[p.id] || 0) * p.price, 0);
const picHTML = p => p.img ? `<img src="${p.img}" alt="">` : ICONS[p.icon];

function stepperHTML(p) {
  return `<div class="stepper"><button type="button" data-act="dec" data-id="${p.id}" aria-label="−1">−</button><output>${cart[p.id]}</output><button type="button" class="plus" data-act="inc" data-id="${p.id}" aria-label="+1">+</button></div>`;
}

function renderGrid() {
  $("#grid").innerHTML = PRODUCTS.map(p => `
    <article class="card" data-id="${p.id}">
      <div class="pic">${picHTML(p)}</div>
      <div class="info"><div class="pr">${fmt(p.price)}<span>${t("sum")}</span></div><h3>${p[lang]}</h3></div>
      <div class="act">${cart[p.id] ? stepperHTML(p) : `<button type="button" class="add" data-act="add" data-id="${p.id}"><svg aria-hidden="true"><use href="#i-plus"/></svg>${t("add")}</button>`}</div>
    </article>`).join("");
}

function renderCart() {
  const items = PRODUCTS.filter(p => cart[p.id]);
  if (!items.length) {
    $("#cart").innerHTML = `<div class="empty"><svg aria-hidden="true"><use href="#i-cart"/></svg><b>${t("cartEmpty")}</b><p>${t("cartEmptySub")}</p><a class="big" href="#">${t("toProducts")}</a></div>`;
    return;
  }
  $("#cart").innerHTML = `<div class="list">${items.map(p => `
    <div class="line">
      <div class="pic">${picHTML(p)}</div>
      <div class="line-body">
        <div class="line-top"><h3>${p[lang]}</h3><small>${fmt(p.price)} ${t("sum")}</small></div>
        <div class="line-bot">${stepperHTML(p)}<span class="line-sum">${fmt(p.price * cart[p.id])} ${t("sum")}</span></div>
      </div>
    </div>`).join("")}</div>
    <div class="summary">
      <div class="total"><span>${t("total")} · ${t("pcs")(count())}</span><b>${fmt(sum())} ${t("sum")}</b></div>
      <a class="big" href="#rasmiylashtirish">${t("checkout")}</a>
    </div>`;
}

function renderBadge(bump) {
  const b = $("#badge"), n = count();
  b.hidden = n === 0;
  b.textContent = n > 99 ? "99+" : n;
  if (bump && !reduced()) b.animate([{ transform: "scale(1)" }, { transform: "scale(1.5)" }, { transform: "scale(1)" }], { duration: 350, easing: "ease-out" });
}

function renderAll() {
  renderGrid(); renderCart(); renderBadge(false);
  $("#co-sum").textContent = `${t("pcs")(count())} · ${fmt(sum())} ${t("sum")}`;
}

const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Card flies down into the cart tab, then "+1" pops */
function flyToCart(card) {
  const target = $("#cart-ic").getBoundingClientRect();
  const done = () => { renderBadge(true); plusOne(target); };
  if (!card || reduced()) { done(); return; }
  const pic = card.querySelector(".pic");
  const r = pic.getBoundingClientRect();
  const fl = document.createElement("div");
  fl.className = "flyer";
  fl.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  fl.appendChild(pic.cloneNode(true));
  document.body.appendChild(fl);
  const dx = target.left + target.width / 2 - (r.left + r.width / 2);
  const dy = target.top + target.height / 2 - (r.top + r.height / 2);
  fl.animate([
    { transform: "translate(0,0) scale(1)", opacity: 1 },
    { transform: `translate(${dx * 0.35}px, ${Math.min(dy * 0.2, 0) - 50}px) scale(.7)`, opacity: 1, offset: 0.35 },
    { transform: `translate(${dx}px, ${dy}px) scale(.12)`, opacity: .7 },
  ], { duration: 750, easing: "cubic-bezier(.45,0,.7,1)" }).onfinish = () => { fl.remove(); done(); };
}
function plusOne(target) {
  const el = document.createElement("div");
  el.className = "plus1"; el.textContent = "+1";
  el.style.left = (target.left + target.width) + "px";
  el.style.top = (target.top - 8) + "px";
  document.body.appendChild(el);
  if (reduced()) { setTimeout(() => el.remove(), 800); return; }
  el.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-34px)", opacity: 0 }], { duration: 800, easing: "ease-out" }).onfinish = () => el.remove();
}

document.addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  const card = btn.closest(".card");
  if (act === "add" || act === "inc") {
    cart[id] = (cart[id] || 0) + 1;
    if (card) flyToCart(card); else renderBadge(true);
  } else if (act === "dec") {
    cart[id] = (cart[id] || 0) - 1;
    if (cart[id] <= 0) delete cart[id];
    renderBadge(false);
  }
  saveCart();
  const keepBadge = $("#badge").textContent;
  renderGrid(); renderCart();
  $("#co-sum").textContent = `${t("pcs")(count())} · ${fmt(sum())} ${t("sum")}`;
  if (act !== "dec" && card && !reduced()) { $("#badge").textContent = keepBadge; }
});

/* ----- Pages (hash) ----- */
const VIEWS = ["", "savatcha", "rasmiylashtirish", "tayyor", "aloqa"];
let orderDone = false;
function route() {
  let v = location.hash.replace("#", "");
  if (!VIEWS.includes(v)) v = "";
  if (v === "rasmiylashtirish" && count() === 0) v = "savatcha";
  if (v === "tayyor" && !orderDone) v = "";
  document.querySelectorAll(".view").forEach(s => s.hidden = s.dataset.view !== v);
  const tab = v === "rasmiylashtirish" ? "savatcha" : v === "tayyor" ? "" : v;
  document.querySelectorAll(".tab").forEach(a => a.toggleAttribute("aria-current", a.dataset.tab === tab) || a.removeAttribute("aria-current"));
  document.querySelectorAll(".tab").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); });
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

/* ----- Language ----- */
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[l][el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-tp]").forEach(el => el.placeholder = T[l][el.dataset.tp]);
  document.querySelectorAll("[data-ta]").forEach(el => el.setAttribute("aria-label", T[l][el.dataset.ta]));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  try { localStorage.setItem("regant-lang", l); } catch (e) {}
  renderAll();
  if (geo) showGeoOk();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ----- Checkout ----- */
let geo = null;
const geoStatus = $("#geo-status");
function showGeoOk() {
  geoStatus.hidden = false; geoStatus.className = "geo-status ok";
  geoStatus.innerHTML = "";
  geoStatus.append(t("geoOk"));
  const a = document.createElement("a");
  a.href = `https://yandex.uz/maps/?pt=${geo.lon},${geo.lat}&z=17&l=map`;
  a.target = "_blank"; a.rel = "noopener"; a.textContent = t("geoMap");
  geoStatus.append(a);
}
$("#geo-btn").addEventListener("click", () => {
  geoStatus.hidden = false; geoStatus.className = "geo-status"; geoStatus.textContent = t("geoWait");
  if (!navigator.geolocation) { geoStatus.className = "geo-status bad"; geoStatus.textContent = t("geoErr"); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { geo = { lat: +pos.coords.latitude.toFixed(6), lon: +pos.coords.longitude.toFixed(6) }; showGeoOk(); $("#err-addr").hidden = true; },
    err => { geoStatus.className = "geo-status bad"; geoStatus.textContent = err.code === 1 ? t("geoDenied") : t("geoErr"); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
});

const phoneEl = $("#phone");
phoneEl.addEventListener("input", () => {
  const d = phoneEl.value.replace(/\D/g, "").replace(/^998/, "").slice(0, 9);
  const parts = [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean);
  phoneEl.value = parts.join(" ");
});

function showErr(id, on, key) { const e = $(id); e.hidden = !on; if (on) e.textContent = t(key); }

$("#order-form").addEventListener("submit", async e => {
  e.preventDefault();
  const address = $("#addr").value.trim();
  const digits = phoneEl.value.replace(/\D/g, "");
  const pay = document.querySelector('input[name="pay"]:checked')?.value;
  const badAddr = !address && !geo, badPhone = digits.length !== 9, badPay = !pay;
  showErr("#err-addr", badAddr, "errAddr");
  showErr("#err-phone", badPhone, "errPhone");
  showErr("#err-pay", badPay, "errPay");
  const msg = $("#send-msg"); msg.hidden = true;
  if (badAddr || badPhone || badPay) { document.querySelector(".err:not([hidden])")?.closest(".field")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

  if (!ORDER_URL) { msg.textContent = t("previewMsg"); msg.hidden = false; return; }

  const btn = $("#submit-btn"), label = btn.querySelector("span");
  btn.disabled = true; label.textContent = t("sending");
  const order = {
    items: PRODUCTS.filter(p => cart[p.id]).map(p => ({ name: p.uz, qty: cart[p.id], price: p.price })),
    total: sum(), address, location: geo, phone: "+998" + digits, payment: pay, lang,
  };
  try {
    const res = await fetch(ORDER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(order) });
    if (!res.ok) throw new Error(res.status);
    cart = {}; saveCart(); geo = null; geoStatus.hidden = true;
    e.target.reset(); orderDone = true; renderAll();
    location.hash = "tayyor";
  } catch (err) {
    msg.textContent = t("errSend"); msg.hidden = false;
  } finally {
    btn.disabled = false; label.textContent = t("submit");
  }
});

/* ----- Start ----- */
let savedLang = null;
try { savedLang = localStorage.getItem("regant-lang"); } catch (e) {}
setLang(savedLang === "ru" ? "ru" : "uz");
route();
</script>
