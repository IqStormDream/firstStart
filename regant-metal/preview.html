<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: clean shop app — sticky wordmark header with cart pill, bold headline, dark banner, currency chips, 2-col product grid, bottom tab bar */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --pic-a: #eceef2;
  --pic-b: #dfe3ea;
  --ink: #121418;
  --muted: #6b7280;
  --faint: #9aa1ad;
  --line: #e3e6eb;
  --dark: #121418;
  --dark-ink: #ffffff;
  --blue: #1f6bff;
  --blue-ink: #ffffff;
  --ok: #17864b;
  --err: #c62828;
  --font: "Inter", "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
  --tabbar: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --surface: #171a1f; --pic-a: #20242b; --pic-b: #272c34; --ink: #f1f3f6; --muted: #a2a9b4; --faint: #6f7783; --line: #2a2f37;
    --dark: #f1f3f6; --dark-ink: #0e1013; --blue: #4c8bff; --blue-ink: #ffffff; --ok: #4cc47f; --err: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #171a1f; --pic-a: #20242b; --pic-b: #272c34; --ink: #f1f3f6; --muted: #a2a9b4; --faint: #6f7783; --line: #2a2f37;
  --dark: #f1f3f6; --dark-ink: #0e1013; --blue: #4c8bff; --blue-ink: #ffffff; --ok: #4cc47f; --err: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 18px; line-height: 1.5;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 20px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { text-decoration: none; display: grid; gap: 4px; min-width: 0; }
.brand b { font-size: clamp(1.05rem, 4.6vw, 1.45rem); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; line-height: 1; }
.brand small { font-size: .66rem; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.cart-pill { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 999px; background: var(--dark); color: var(--dark-ink); text-decoration: none; font-weight: 700; font-size: .95rem; }
.cart-pill svg { width: 20px; height: 20px; }
.cart-pill output { font-variant-numeric: tabular-nums; }

/* Home hero */
.hero { padding-block: 28px 8px; display: grid; gap: 14px; }
.eyebrow-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { color: var(--blue); font-size: .85rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; }
.lang { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.lang button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 700; font-size: .85rem; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--dark); color: var(--dark-ink); }
.hero h1 { font-size: clamp(2.6rem, 11vw, 4rem); font-weight: 800; letter-spacing: -.035em; line-height: 1.02; text-wrap: balance; }
.hero p { color: var(--muted); font-size: 1.15rem; max-width: 34em; }

.banner { margin-top: 8px; background: var(--dark); color: var(--dark-ink); border-radius: 18px; padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.banner b { display: block; font-size: 1.35rem; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
.banner span { color: var(--blue); font-size: 1rem; }
.banner .dot { flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; color: var(--blue-ink); font-weight: 800; font-size: 1.05rem; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.chip { min-height: 46px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1rem; font-weight: 500; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }

.sec-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 28px 0 16px; }
.sec-row h2 { font-size: 1.75rem; font-weight: 800; letter-spacing: -.02em; }
.sec-row small { color: var(--muted); font-size: .95rem; }

/* Product cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.pic { position: relative; aspect-ratio: 1 / 1; max-width: 100%; background: linear-gradient(160deg, var(--pic-a), var(--pic-b)); display: grid; place-items: center; overflow: hidden; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic .ph { font-size: .95rem; font-weight: 700; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; text-align: center; padding: 0 8px; }
.pic .wm { position: absolute; right: 12px; bottom: 10px; font-size: .62rem; font-weight: 700; letter-spacing: .24em; color: var(--faint); }
.body { padding: 14px 14px 16px; display: grid; gap: 2px; flex: 1; align-content: start; }
.body h3 { font-size: 1.1rem; font-weight: 700; line-height: 1.25; }
.body .cat { color: var(--muted); font-size: .95rem; }
.buy { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.price { font-size: 1.12rem; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
.price span { display: block; font-weight: 700; }
.add { min-height: 46px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--blue); color: var(--blue-ink); font-size: .98rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.add b { font-size: 1.2rem; line-height: 1; }
.stepper { display: inline-grid; grid-template-columns: 42px minmax(28px, auto) 42px; align-items: center; min-height: 46px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.stepper button { height: 44px; border: 0; background: transparent; color: var(--ink); font-size: 1.4rem; font-weight: 700; cursor: pointer; line-height: 1; }
.stepper button.plus { background: var(--blue); color: var(--blue-ink); border-radius: 999px; }
.stepper output { text-align: center; font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 0 4px; }
.hint { color: var(--muted); font-size: .95rem; margin-top: 16px; }

/* Generic page head */
.view { padding-block: 24px 8px; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.page-head h2 { font-size: 2rem; font-weight: 800; letter-spacing: -.025em; }
.back { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; flex: none; }
.back svg { width: 22px; height: 22px; }

/* Cart */
.list { display: grid; gap: 12px; }
.line { display: grid; grid-template-columns: 92px 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.line .pic { border-radius: 12px; width: 92px; }
.line .pic .ph { font-size: .6rem; letter-spacing: .14em; }
.line .pic .wm { display: none; }
.line-body { display: grid; gap: 4px; min-width: 0; align-content: center; }
.line-body h3 { font-size: 1.1rem; font-weight: 700; }
.line-body .cat { color: var(--muted); font-size: .92rem; }
.line-bot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.line-sum { font-weight: 800; font-size: 1.08rem; font-variant-numeric: tabular-nums; }
.summary { margin-top: 16px; background: var(--dark); color: var(--dark-ink); border-radius: 18px; padding: 20px; display: grid; gap: 16px; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.total span { opacity: .7; }
.total b { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.big { width: 100%; min-height: 58px; border: 0; border-radius: 999px; background: var(--blue); color: var(--blue-ink); font-size: 1.12rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
.big[disabled] { opacity: .6; cursor: progress; }
.empty { text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 40px 20px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 60px; height: 60px; color: var(--faint); }
.empty b { font-size: 1.3rem; }
.empty p { color: var(--muted); max-width: 26em; }
.empty .big { max-width: 300px; margin-top: 8px; }

/* Checkout */
.form { display: grid; gap: 14px; }
.mini { color: var(--muted); }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.field > label, .field legend { font-weight: 800; font-size: 1.12rem; padding: 0; }
fieldset.field { margin: 0; min-width: 0; }
textarea, input[type="tel"] { width: 100%; font: inherit; font-size: 1.1rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 15px; }
textarea { min-height: 86px; resize: vertical; }
textarea:focus, input[type="tel"]:focus { border-color: var(--blue); outline: none; }
.geo { min-height: 52px; border: 0; background: var(--dark); color: var(--dark-ink); border-radius: 999px; font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.geo svg { width: 22px; height: 22px; color: var(--blue); }
.geo-status { font-size: .98rem; }
.geo-status.ok { color: var(--ok); font-weight: 600; }
.geo-status.bad { color: var(--err); }
.geo-status a { margin-left: 6px; color: var(--blue); }
.phone { display: flex; }
.phone span { display: grid; place-items: center; padding: 0 14px; font-size: 1.1rem; font-weight: 700; background: var(--bg); border: 1.5px solid var(--line); border-right: 0; border-radius: 14px 0 0 14px; }
.phone input { border-radius: 0 14px 14px 0; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--bg); font-weight: 500; }
.opt input { width: 22px; height: 22px; accent-color: var(--blue); flex: none; margin: 0; }
.opt:has(input:checked) { border-color: var(--blue); background: var(--surface); }
.small-note { color: var(--muted); font-size: .92rem; }
.err { color: var(--err); font-size: .98rem; font-weight: 600; }
.notice { border-radius: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); font-size: 1rem; }

.done { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 34px 8px; }
.done .tick { width: 84px; height: 84px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; color: var(--blue-ink); }
.done .tick svg { width: 44px; height: 44px; }
.done h2 { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; }
.done p { color: var(--muted); max-width: 26em; }
.done .big { max-width: 300px; }

/* Contact */
.about { background: var(--dark); color: var(--dark-ink); border-radius: 18px; padding: 20px; display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.about b { font-size: 2.8rem; font-weight: 800; color: var(--blue); line-height: 1; flex: none; letter-spacing: -.03em; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px 18px; display: grid; margin-bottom: 14px; }
.box h3 { font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding-top: 14px; }
.row { display: flex; align-items: center; gap: 14px; text-decoration: none; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row svg { width: 26px; height: 26px; flex: none; color: var(--blue); }
.row span { display: grid; line-height: 1.3; min-width: 0; }
.row small { color: var(--muted); font-size: .88rem; }
.row b { font-size: 1.12rem; font-weight: 700; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar); }
.tab { display: grid; justify-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: .82rem; font-weight: 600; }
.tab[aria-current="page"] { color: var(--blue); }
.tab .ic { position: relative; width: 26px; height: 26px; }
.tab .ic svg { width: 26px; height: 26px; }
.badge { position: absolute; top: -7px; right: -13px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--blue); color: var(--blue-ink); font-size: .78rem; font-weight: 800; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

.flyer { position: fixed; z-index: 50; pointer-events: none; border-radius: 18px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.flyer .pic { width: 100%; height: 100%; }
.plus1 { position: fixed; z-index: 51; pointer-events: none; font-weight: 800; font-size: 1.2rem; color: var(--blue); }

@media (max-width: 360px) {
  .brand b { letter-spacing: .06em; }
  .cart-pill { padding: 0 12px; gap: 6px; }
}
@media (prefers-reduced-motion: no-preference) {
  .add, .big, .chip, .stepper button, .cart-pill { transition: transform .12s ease, filter .12s ease; }
  .add:active, .big:active, .chip:active, .stepper button:active { transform: scale(.96); }
}
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><b>Regant Metal</b><small data-t="tagline"></small></a>
    <a class="cart-pill" href="#savatcha"><svg aria-hidden="true"><use href="#i-cart"/></svg><span data-t="tabCart"></span><output id="pill-count">0</output></a>
  </div>
</header>

<main>
  <!-- Home / products -->
  <section class="view-home" data-view="">
    <div class="wrap">
      <div class="hero">
        <div class="eyebrow-row">
          <span class="eyebrow" data-t="eyebrow"></span>
          <div class="lang" role="group" aria-label="Til / Язык">
            <button type="button" id="lang-uz" data-lang="uz" aria-pressed="true">UZ</button>
            <button type="button" id="lang-ru" data-lang="ru" aria-pressed="false">RU</button>
          </div>
        </div>
        <h1 data-t="h1"></h1>
        <p data-t="lead"></p>
        <div class="banner">
          <div><b>Regant Metal</b><span data-t="bannerSub"></span></div>
          <div class="dot">25</div>
        </div>
      </div>

      <div class="chips" role="group" aria-label="Valyuta">
        <button type="button" class="chip" id="cur-uzs" data-cur="uzs" aria-pressed="true" data-t="curUzs"></button>
        <button type="button" class="chip" id="cur-usd" data-cur="usd" aria-pressed="false" data-t="curUsd"></button>
      </div>

      <div class="sec-row"><h2 data-t="prodTitle"></h2><small id="cur-note"></small></div>
      <div class="grid" id="grid"></div>
      <p class="hint" data-t="priceNote"></p>
    </div>
  </section>

  <!-- Cart -->
  <section class="view wrap" data-view="savatcha" hidden aria-labelledby="h-cart">
    <div class="page-head">
      <a class="back" href="#" data-ta="back"><svg aria-hidden="true"><use href="#i-back"/></svg></a>
      <h2 id="h-cart" data-t="cartTitle"></h2>
    </div>
    <div id="cart"></div>
  </section>

  <!-- Checkout -->
  <section class="view wrap" data-view="rasmiylashtirish" hidden aria-labelledby="h-co">
    <div class="page-head">
      <a class="back" href="#savatcha" data-ta="back"><svg aria-hidden="true"><use href="#i-back"/></svg></a>
      <h2 id="h-co" data-t="coTitle"></h2>
    </div>
    <form class="form" id="order-form" novalidate>
      <p class="mini" id="co-sum"></p>

      <div class="field">
        <label for="addr" data-t="addrLbl"></label>
        <button type="button" class="geo" id="geo-btn"><svg aria-hidden="true"><use href="#i-pin"/></svg><span data-t="geoBtn"></span></button>
        <p class="geo-status" id="geo-status" hidden></p>
        <textarea id="addr" name="address" maxlength="400" data-tp="addrPh"></textarea>
        <p class="err" id="err-addr" hidden></p>

    coTitle: "Оформление", back: "Назад",
    addrLbl: "1. Адрес",
    geoBtn: "Определить моё местоположение", geoWait: "Определяем...",
    geoOk: "Местоположение получено.", geoMap: "Посмотреть на карте",

    previewMsg: "Это пробный просмотр, поэтому заказ не отправлен. Когда сайт будет на Netlify и подключён к боту, заказы будут приходить в Telegram.",
    doneTitle: "Ваш заказ принят",
    doneText: "Скоро мы свяжемся с вами по телефону.",
    doneBtn: "На главную",
    contactTitle: "Контакты",
    aboutText: "Regant Metal уже 25 лет торгует металлопрокатом.",
    phoneRow: "Телефон", orderRow: "Для заказа",
    storesTitle: "Наши магазины", a1: "Магазин 1: рынок Изза", a2: "Магазин 2: Ибн Сино", map: "Открыть на карте",
  },
};

const ORDER_URL = document.querySelector('meta[name="order-endpoint"]')?.content || "";

let lang = "uz", cur = "uzs";
const t = k => T[lang][k];
const $ = s => document.querySelector(s);
const fmtInt = n => Math.round(n).toLocaleString("ru-RU").replace(/[  ]/g, " ");
const money = n => cur === "usd" ? "$" + (n / USD_RATE).toFixed(2) : fmtInt(n) + " " + t("sum");
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ----- Cart state ----- */
let cart = {};
try { cart = JSON.parse(localStorage.getItem("regant-cart") || "{}") || {}; } catch (e) { cart = {}; }
for (const id in cart) if (!PRODUCTS.find(p => p.id === id) || !(cart[id] > 0)) delete cart[id];
const saveCart = () => { try { localStorage.setItem("regant-cart", JSON.stringify(cart)); } catch (e) {} };
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const sum = () => PRODUCTS.reduce((a, p) => a + (cart[p.id] || 0) * p.price, 0);
const picHTML = p => p.img ? `<img src="${p.img}" alt="">` : `<span class="ph">${p[lang].name}</span><span class="wm">REGANT</span>`;

const stepperHTML = p => `<div class="stepper"><button type="button" data-act="dec" data-id="${p.id}" aria-label="−1">−</button><output>${cart[p.id]}</output><button type="button" class="plus" data-act="inc" data-id="${p.id}" aria-label="+1">+</button></div>`;
const priceHTML = n => cur === "usd" ? `$${(n / USD_RATE).toFixed(2)}` : `${fmtInt(n)}<span>${t("sum")}</span>`;

function renderGrid() {
  $("#grid").innerHTML = PRODUCTS.map(p => `
    <article class="card" data-id="${p.id}">
      <div class="pic">${picHTML(p)}</div>
      <div class="body">
        <h3>${p[lang].name}</h3>
        <span class="cat">${p[lang].cat}</span>
        <div class="buy">
          <div class="price">${priceHTML(p.price)}</div>
          ${cart[p.id] ? stepperHTML(p) : `<button type="button" class="add" data-act="add" data-id="${p.id}"><b>+</b>${t("add")}</button>`}
        </div>
      </div>
    </article>`).join("");
}

function renderCart() {
  const items = PRODUCTS.filter(p => cart[p.id]);
  if (!items.length) {
    $("#cart").innerHTML = `<div class="empty"><svg aria-hidden="true"><use href="#i-cart"/></svg><b>${t("cartEmpty")}</b><p>${t("cartEmptySub")}</p><a class="big" href="#">${t("toProducts")}</a></div>`;
    return;
  }
  $("#cart").innerHTML = `<div class="list">${items.map(p => `
    <div class="line">
      <div class="pic">${picHTML(p)}</div>
      <div class="line-body">
        <h3>${p[lang].name}</h3>
        <span class="cat">${money(p.price)}</span>
        <div class="line-bot">${stepperHTML(p)}<span class="line-sum">${money(p.price * cart[p.id])}</span></div>
      </div>
    </div>`).join("")}</div>
    <div class="summary">
      <div class="total"><span>${t("total")} · ${t("pcs")(count())}</span><b>${money(sum())}</b></div>
      <a class="big" href="#rasmiylashtirish">${t("checkout")}</a>
    </div>`;
}

function renderCounts(bump) {
  const n = count(), b = $("#badge");
  b.hidden = n === 0; b.textContent = n > 99 ? "99+" : n;
  $("#pill-count").textContent = n;
  if (bump && !reduced()) b.animate([{ transform: "scale(1)" }, { transform: "scale(1.5)" }, { transform: "scale(1)" }], { duration: 350, easing: "ease-out" });
}

function renderAll() {
  renderGrid(); renderCart(); renderCounts(false);
  $("#co-sum").textContent = `${t("pcs")(count())} · ${money(sum())}`;
  $("#cur-note").textContent = cur === "usd" ? t("noteUsd")(fmtInt(USD_RATE)) : t("noteUzs");
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.cur === cur)));
}

/* Card flies down into the bottom cart, then "+1" pops */
function flyToCart(card, onLand) {
  const target = $("#cart-ic").getBoundingClientRect();
  const land = () => { onLand(); plusOne(target); };
  if (!card || reduced()) { land(); return; }
  const pic = card.querySelector(".pic");
  const r = pic.getBoundingClientRect();
  const fl = document.createElement("div");
  fl.className = "flyer";
  fl.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  fl.appendChild(pic.cloneNode(true));
  document.body.appendChild(fl);
  const dx = target.left + target.width / 2 - (r.left + r.width / 2);
  const dy = target.top + target.height / 2 - (r.top + r.height / 2);
  fl.animate([
    { transform: "translate(0,0) scale(1)", opacity: 1 },
    { transform: `translate(${dx * 0.3}px, ${Math.min(dy * 0.15, 0) - 50}px) scale(.7)`, opacity: 1, offset: 0.35 },
    { transform: `translate(${dx}px, ${dy}px) scale(.1)`, opacity: .7 },
  ], { duration: 750, easing: "cubic-bezier(.45,0,.7,1)" }).onfinish = () => { fl.remove(); land(); };
}
function plusOne(target) {
  const el = document.createElement("div");
  el.className = "plus1"; el.textContent = "+1";
  el.style.left = (target.left + target.width) + "px";
  el.style.top = (target.top - 8) + "px";
  document.body.appendChild(el);
  if (reduced()) { setTimeout(() => el.remove(), 800); return; }
  el.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-34px)", opacity: 0 }], { duration: 800, easing: "ease-out" }).onfinish = () => el.remove();
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { cur = chip.dataset.cur; try { localStorage.setItem("regant-cur", cur); } catch (err) {} renderAll(); return; }
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  const card = btn.closest(".card");
  if (act === "dec") {
    cart[id] = (cart[id] || 0) - 1;
    if (cart[id] <= 0) delete cart[id];
    saveCart(); renderAll();
    return;
  }
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  if (card) flyToCart(card, () => renderCounts(true));
  renderGrid(); renderCart();
  $("#co-sum").textContent = `${t("pcs")(count())} · ${money(sum())}`;
  if (!card) renderCounts(true);
});

/* ----- Pages ----- */
const VIEWS = ["", "savatcha", "rasmiylashtirish", "tayyor", "aloqa"];
let orderDone = false;
function route() {
  let v = location.hash.replace("#", "");
  if (!VIEWS.includes(v)) v = "";
  if (v === "rasmiylashtirish" && count() === 0) v = "savatcha";
  if (v === "tayyor" && !orderDone) v = "";
  document.querySelectorAll("[data-view]").forEach(s => s.hidden = s.dataset.view !== v);
  const tab = v === "rasmiylashtirish" ? "savatcha" : v === "tayyor" ? "" : v;
  document.querySelectorAll(".tab").forEach(a => {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

/* ----- Language ----- */
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[l][el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-tp]").forEach(el => el.placeholder = T[l][el.dataset.tp]);
  document.querySelectorAll("[data-ta]").forEach(el => el.setAttribute("aria-label", T[l][el.dataset.ta]));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  try { localStorage.setItem("regant-lang", l); } catch (e) {}
  renderAll();
  if (geo) showGeoOk();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ----- Checkout ----- */
let geo = null;
const geoStatus = $("#geo-status");
function showGeoOk() {
  geoStatus.hidden = false; geoStatus.className = "geo-status ok"; geoStatus.innerHTML = "";
  geoStatus.append(t("geoOk"));
  const a = document.createElement("a");
  a.href = `https://yandex.uz/maps/?pt=${geo.lon},${geo.lat}&z=17&l=map`;
  a.target = "_blank"; a.rel = "noopener"; a.textContent = t("geoMap");
  geoStatus.append(a);
}
$("#geo-btn").addEventListener("click", () => {
  geoStatus.hidden = false; geoStatus.className = "geo-status"; geoStatus.textContent = t("geoWait");
  if (!navigator.geolocation) { geoStatus.className = "geo-status bad"; geoStatus.textContent = t("geoErr"); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { geo = { lat: +pos.coords.latitude.toFixed(6), lon: +pos.coords.longitude.toFixed(6) }; showGeoOk(); $("#err-addr").hidden = true; },
    err => { geoStatus.className = "geo-status bad"; geoStatus.textContent = err.code === 1 ? t("geoDenied") : t("geoErr"); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
});

const phoneEl = $("#phone");
phoneEl.addEventListener("input", () => {
  const d = phoneEl.value.replace(/\D/g, "").replace(/^998/, "").slice(0, 9);
  phoneEl.value = [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean).join(" ");
});

function showErr(id, on, key) { const e = $(id); e.hidden = !on; if (on) e.textContent = t(key); }

$("#order-form").addEventListener("submit", async e => {
  e.preventDefault();
  const address = $("#addr").value.trim();
  const digits = phoneEl.value.replace(/\D/g, "");
  const pay = document.querySelector('input[name="pay"]:checked')?.value;
  const badAddr = !address && !geo, badPhone = digits.length !== 9, badPay = !pay;
  showErr("#err-addr", badAddr, "errAddr");
  showErr("#err-phone", badPhone, "errPhone");
  showErr("#err-pay", badPay, "errPay");
  const msg = $("#send-msg"); msg.hidden = true;
  if (badAddr || badPhone || badPay) { document.querySelector(".err:not([hidden])")?.closest(".field")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

  if (!ORDER_URL) { msg.textContent = t("previewMsg"); msg.hidden = false; return; }

  const btn = $("#submit-btn"), label = btn.querySelector("span");
  btn.disabled = true; label.textContent = t("sending");
  const order = {
    items: PRODUCTS.filter(p => cart[p.id]).map(p => ({ name: p.uz.name, qty: cart[p.id], price: p.price })),
    total: sum(), address, location: geo, phone: "+998" + digits, payment: pay, lang,
    currency: cur, usdRate: USD_RATE,
  };
  try {
    const res = await fetch(ORDER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(order) });
    if (!res.ok) throw new Error(res.status);
    cart = {}; saveCart(); geo = null; geoStatus.hidden = true;
    e.target.reset(); orderDone = true; renderAll();
    location.hash = "tayyor";
  } catch (err) {
    msg.textContent = t("errSend"); msg.hidden = false;
  } finally {
    btn.disabled = false; label.textContent = t("submit");
  }
});

/* ----- Start ----- */
let savedLang = null;
try { savedLang = localStorage.getItem("regant-lang"); cur = localStorage.getItem("regant-cur") === "usd" ? "usd" : "uzs"; } catch (e) {}
setLang(savedLang === "ru" ? "ru" : "uz");
route();
</script>
